<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10ETF 雪球同屏</title>
    <style>
        :root {
            --bg: #0a0e17;
            --card: #111827;
            --line: #1e2d45;
            --gold: #c9a84c;
            --text: #e8edf5;
            --muted: #8896ab;
            --dim: #5a6678;
            --cols: 5;
            --doc-h: 820;
            color-scheme: dark;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            font-size: 13px;
        }
        header.bar {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 14px;
            padding: 10px 14px;
            background: rgba(10, 14, 23, 0.92);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(10px);
        }
        .brand { font-weight: 650; letter-spacing: 0.04em; }
        .brand span { color: var(--gold); font-weight: 600; margin-left: 8px; }
        .hint { color: var(--muted); }
        .bar .spacer { flex: 1; }
        label.ctrl, button, .tune summary {
            color: var(--text);
            font: inherit;
        }
        label.ctrl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
        button, select, input[type="number"] {
            background: #1a2234;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 5px 8px;
        }
        button { cursor: pointer; }
        button:hover { border-color: var(--gold); color: var(--gold); }
        input[type="range"] { accent-color: var(--gold); width: 120px; }
        .status { color: var(--gold); min-width: 7em; }
        .tune { color: var(--muted); }
        .tune summary { cursor: pointer; }
        .tune-row { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 0 0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
            gap: 10px;
            padding: 10px;
        }
        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            min-width: 0;
        }
        .card-hd {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 6px 8px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
        }
        .card-hd .name { font-weight: 650; }
        .card-hd .code { color: var(--dim); font-variant-numeric: tabular-nums; }
        .card-hd a {
            margin-left: auto;
            color: var(--gold);
            text-decoration: none;
            white-space: nowrap;
        }
        .crop {
            position: relative;
            overflow: hidden;
            background: #f5f5f5;
            height: 280px;
        }
        .crop iframe {
            position: absolute;
            width: 1100px;
            height: 2400px;
            border: 0;
            transform-origin: 0 0;
            background: #fff;
            pointer-events: none;
        }
        html.interactive .crop iframe { pointer-events: auto; }
        .mask {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
            color: #5a6678;
            background: rgba(255, 255, 255, 0.92);
        }
        .mask.bad { color: #9a3412; }
        .mask[hidden] { display: none; }
    </style>
</head>
<body>
    <header class="bar">
        <div class="brand">10ETF <span>雪球同屏</span></div>
        <div class="hint">只显示雪球主体，报价由页面自己刷新</div>
        <div class="spacer"></div>
        <label class="ctrl">列
            <select id="cols">
                <option value="5">5</option>
                <option value="2">2</option>
            </select>
        </label>
        <label class="ctrl">主体高度
            <input id="docH" type="range" min="420" max="1600" step="20" value="820">
        </label>
        <span class="status" id="status">加载中</span>
        <button type="button" id="reload">刷新</button>
        <label class="ctrl"><input id="interactive" type="checkbox"> 允许点击</label>
        <details class="tune">
            <summary>微调</summary>
            <div class="tune-row">
                <label class="ctrl">上移 <input id="cropY" type="number" min="0" max="400" step="1" value="56"></label>
                <label class="ctrl">左移 <input id="cropX" type="number" min="0" max="800" step="1" value="190"></label>
                <label class="ctrl">主体宽 <input id="mainW" type="number" min="400" max="900" step="1" value="640"></label>
                <button type="button" id="resetCrop">恢复默认</button>
            </div>
        </details>
    </header>
    <main class="grid" id="grid"></main>
    <script>
        const DEFAULTS = { cols: "5", docH: "820", cropX: "190", cropY: "56", mainW: "640" };
        const STORE = "10etf-xueqiu-desk";
        const IFRAME_W = 1100;
        const IFRAME_H = 2400;

        const grid = document.getElementById("grid");
        const statusEl = document.getElementById("status");
        const colsEl = document.getElementById("cols");
        const docHEl = document.getElementById("docH");
        const cropXEl = document.getElementById("cropX");
        const cropYEl = document.getElementById("cropY");
        const mainWEl = document.getElementById("mainW");
        const interactiveEl = document.getElementById("interactive");

        function readStore() {
            try { return JSON.parse(localStorage.getItem(STORE) || "{}"); }
            catch (e) { return {}; }
        }
        function writeStore(patch) {
            const next = Object.assign(readStore(), patch);
            localStorage.setItem(STORE, JSON.stringify(next));
        }
        function field(id, el) {
            const saved = readStore()[id];
            if (saved != null && saved !== "") el.value = saved;
        }

        field("cols", colsEl);
        field("docH", docHEl);
        field("cropX", cropXEl);
        field("cropY", cropYEl);
        field("mainW", mainWEl);
        interactiveEl.checked = readStore().interactive === true;
        document.documentElement.classList.toggle("interactive", interactiveEl.checked);

        function num(el, fallback) {
            const n = Number(el.value);
            return Number.isFinite(n) && n > 0 ? n : fallback;
        }

        function layoutAll() {
            const mainW = num(mainWEl, 640);
            const docH = num(docHEl, 820);
            const cropX = num(cropXEl, 190);
            const cropY = num(cropYEl, 56);
            document.documentElement.style.setProperty("--cols", colsEl.value || "5");
            grid.querySelectorAll(".crop").forEach((crop) => {
                const w = crop.clientWidth || 1;
                const h = Math.max(120, Math.round(docH * w / mainW));
                crop.style.height = h + "px";
                const iframe = crop.querySelector("iframe");
                const scale = w / mainW;
                iframe.style.width = IFRAME_W + "px";
                iframe.style.height = IFRAME_H + "px";
                iframe.style.zoom = "1";
                iframe.style.transformOrigin = "0 0";
                iframe.style.transform = "scale(" + scale + ")";
                iframe.style.left = (-cropX * scale) + "px";
                iframe.style.top = (-cropY * scale) + "px";
            });
        }

        function frameState(iframe) {
            try {
                const href = iframe.contentWindow.location.href;
                if (!href || href === "about:blank") return "blank";
                return "same";
            } catch (e) {
                return "ok";
            }
        }

        function paintStatus() {
            const frames = [...grid.querySelectorAll("iframe")];
            if (!frames.length) {
                statusEl.textContent = "没有 ETF";
                return;
            }
            const ok = frames.filter((f) => frameState(f) === "ok").length;
            const bad = frames.filter((f) => f.dataset.state === "bad").length;
            statusEl.textContent = bad ? (ok + "/" + frames.length + "，" + bad + " 失败") : (ok + "/" + frames.length);
        }

        function watchFrame(iframe) {
            const mask = iframe.parentElement.querySelector(".mask");
            const mark = () => {
                const state = frameState(iframe);
                if (state === "ok") {
                    iframe.dataset.state = "ok";
                    mask.hidden = true;
                } else if (iframe.dataset.state !== "ok") {
                    iframe.dataset.state = "bad";
                    mask.hidden = false;
                    mask.classList.add("bad");
                    mask.textContent = "雪球页面没有嵌进来。点右上角「打开」单独查看。";
                }
                paintStatus();
            };
            iframe.addEventListener("load", mark);
            setTimeout(mark, 12000);
        }

        function mount(items) {
            grid.innerHTML = "";
            items.forEach((item, i) => {
                const card = document.createElement("article");
                card.className = "card";
                card.innerHTML =
                    '<div class="card-hd">' +
                        '<span class="name"></span>' +
                        '<span class="code"></span>' +
                        '<a target="_blank" rel="noopener noreferrer">打开</a>' +
                    '</div>' +
                    '<div class="crop">' +
                        '<div class="mask">正在打开雪球…</div>' +
                        '<iframe scrolling="no" referrerpolicy="no-referrer-when-downgrade"></iframe>' +
                    '</div>';
                card.querySelector(".name").textContent = item.name;
                card.querySelector(".code").textContent = item.symbol;
                const link = card.querySelector("a");
                link.href = item.url;
                const iframe = card.querySelector("iframe");
                iframe.title = item.name + " " + item.symbol;
                grid.appendChild(card);
                watchFrame(iframe);
                setTimeout(() => { iframe.src = item.url; }, 350 * i);
            });
            layoutAll();
            paintStatus();
        }

        async function loadEtfs() {
            const resp = await fetch("/api/etfs");
            if (!resp.ok) throw new Error(String(resp.status));
            const data = await resp.json();
            if (!data.items || !data.items.length) throw new Error("empty");
            return data.items;
        }

        function reloadAll() {
            grid.querySelectorAll("iframe").forEach((iframe, i) => {
                const mask = iframe.parentElement.querySelector(".mask");
                iframe.dataset.state = "";
                mask.classList.remove("bad");
                mask.hidden = false;
                mask.textContent = "正在打开雪球…";
                const src = iframe.src;
                iframe.src = "about:blank";
                setTimeout(() => { iframe.src = src; }, 200 + 350 * i);
            });
            paintStatus();
        }

        colsEl.addEventListener("change", () => { writeStore({ cols: colsEl.value }); layoutAll(); });
        docHEl.addEventListener("input", () => { writeStore({ docH: docHEl.value }); layoutAll(); });
        [cropXEl, cropYEl, mainWEl].forEach((el) => {
            el.addEventListener("change", () => {
                writeStore({ cropX: cropXEl.value, cropY: cropYEl.value, mainW: mainWEl.value });
                layoutAll();
            });
        });
        interactiveEl.addEventListener("change", () => {
            document.documentElement.classList.toggle("interactive", interactiveEl.checked);
            writeStore({ interactive: interactiveEl.checked });
        });
        document.getElementById("reload").addEventListener("click", reloadAll);
        document.getElementById("resetCrop").addEventListener("click", () => {
            cropXEl.value = DEFAULTS.cropX;
            cropYEl.value = DEFAULTS.cropY;
            mainWEl.value = DEFAULTS.mainW;
            docHEl.value = DEFAULTS.docH;
            writeStore({ cropX: DEFAULTS.cropX, cropY: DEFAULTS.cropY, mainW: DEFAULTS.mainW, docH: DEFAULTS.docH });
            layoutAll();
        });
        new ResizeObserver(() => layoutAll()).observe(grid);

        loadEtfs().then(mount).catch((err) => {
            statusEl.textContent = "列表加载失败";
            grid.innerHTML = '<p class="hint">无法读取 /api/etfs。请用 desktop/server.py 打开本页。</p>';
            console.error(err);
        });
    </script>
</body>
</html>
